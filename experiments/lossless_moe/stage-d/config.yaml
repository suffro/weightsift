# Lossless MoE weight compression: feasibility study (research/lossless_moe). Brief of 2026-10-15.
# Everything that selects data, splits it or judges it is fixed here, before any measurement.
format: lossless-moe-config
version: 1
seed: 20261015

# Pre-registered from the brief (§ 6 and § 9); never changed after results.
gates:
  # The reference is the strongest practical static rANS coder on the same bytes: order-0 tables per tensor (per field
  # for BF16: the exponent coded, sign and mantissa stored), every header, table and stream byte counted.
  reference: strongest-static-rans
  # Reductions of total compressed bytes against that reference, on held-out real MoE int4 data.
  strong_success: 0.25
  exceptional: 0.40
  partial: 0.10          # 0.10-0.25: scientifically interesting, insufficient for a pivot; below 0.10: negative
  # Stage B feasibility gate on the best achievable held-out code length of any context model, costs included:
  stage_b_plausible: 0.25          # >= 0.25: plausible
  stage_b_limited_prototype: 0.10  # 0.10-0.25: uncertain, worth a limited prototype; < 0.10: unsupported -> stop

corpus:
  # Local BF16 checkpoints (the Hugging Face cache; nothing downloaded). One sample per model: `layers`, and per layer
  # `experts_per_layer` experts drawn by a seeded permutation (corpus.sample_experts).
  bf16:
    moonlight:
      repository: moonshotai/Moonlight-16B-A3B
      revision: 476b36a473d4467f94469414bef6cee75c9c8172
      layout: per_expert
      layers: [1, 6, 11, 16, 21, 26]   # MoE layers are 1..26 (first_k_dense_replace = 1)
      experts_per_layer: 8
    olmoe:
      repository: allenai/OLMoE-1B-7B-0924
      revision: 6d84c48581ece794365f2b8e9cfb043c68ade9c5
      layout: per_expert
      layers: [0, 5, 10, 15]
      experts_per_layer: 8
    granite:
      repository: ibm-granite/granite-3.1-1b-a400m-instruct
      revision: 0da7a48b0276d500ce5922fd2b33944091fc6c09
      layout: fused_granite
      layers: [0, 8, 16, 23]
      experts_per_layer: 8

splits:
  # Calibration (tables are trained there) and evaluation (scored there) never share a matrix.
  # held_out_experts: within each sampled layer, the sampled experts in ascending order alternate calibration (even
  #   position) and evaluation (odd position).
  # held_out_layers: the first half of a model's sampled layers calibrate, the second half evaluate.
  kinds: [held_out_experts, held_out_layers]

# Quantized experts as their publishers or Colibri ship them, fetched by HTTP range requests (fetch_sample.py) ONLY
# with the user's approval: 4 layers x 4 experts per source, every projection with its scales, nothing else.
samples:
  glm52_int4_row:            # Colibri's per-row int4 container of GLM-5.2 (the format of its 0.76 and 2.91-bit claims)
    repository: jlnsrk/GLM-5.2-colibri-int4
    revision: cce7e760eab7eeba0a93b7074b64651ff3830928
    layout: per_expert_colibri_int4
    format: int4_row
    experts: 256
    layers: [10, 30, 50, 76]
    experts_per_layer: 4
    shapes: {gate: [2048, 6144], up: [2048, 6144], down: [6144, 2048]}
  inkling_int4_row:          # Colibri's per-row int4 container of Inkling (Weightsift's first flagship; 7B's E4)
    repository: nbeerbower/Inkling-colibri-int4
    revision: 3981e658ed68ec681554d48a62f9a29dd9e61543
    layout: fused_colibri_int4
    format: int4_row
    experts: 256
    layers: [10, 25, 40, 60]
    experts_per_layer: 4
    shapes: {gate_up: [6144, 6144], down: [6144, 3072]}
  mimo_v26_pro_mxfp4:        # the publisher's MXFP4 experts of MiMo-V2.6 Pro (the second flagship)
    repository: XiaomiMiMo/MiMo-V2.6-Pro-MOPD
    revision: 6a7f202e8dbd0e57b3fe1da03917d08d75abc4b8
    layout: per_expert_mxfp4
    format: mxfp4
    experts: 384
    layers: [10, 30, 50, 68]
    experts_per_layer: 4
    shapes: {gate: [2048, 6144], up: [2048, 6144], down: [6144, 2048]}
  kimi_k2_int4_g32:          # the publisher's int4 (quantization-aware training, group 32, BF16 scales)
    repository: moonshotai/Kimi-K2-Thinking
    revision: a51ccc050d73dab088bf7b0e2dd9b30ae85a4e55
    layout: per_expert_ct_int4
    format: int4_g32_bf16
    experts: 384
    layers: [10, 25, 40, 58]
    experts_per_layer: 4
    shapes: {gate: [2048, 7168], up: [2048, 7168], down: [7168, 2048]}
  gptoss20b_mxfp4:           # the publisher's MXFP4 experts of gpt-oss-20b (a third architecture family)
    repository: openai/gpt-oss-20b
    revision: 6cee5e81ee83917806bbde320786a8fb61efebee
    layout: fused_gptoss_mxfp4
    format: mxfp4
    experts: 32
    layers: [2, 8, 14, 22]
    experts_per_layer: 4
    shapes: {gate_up: [5760, 2880], down: [2880, 2880]}

# Labelled diagnostic, never a principal result (the brief forbids principal int4 results from re-quantized BF16):
# Moonlight's sampled experts quantized with Colibri's per-row recipe (c/tools/convert_inkling_int4.py at bf244291:
# scale = absmax/7 per row, rint, clip to [-8, 7], offset 8, low nibble = even column). It shows what a per-row int4
# container does to the structure measured in BF16, on the same weights. requantize.py writes it as a sample.
diagnostic:
  moonlight_requant_int4:
    derived_from: moonlight
    sample_as: moonlight      # the same experts as the BF16 sample
    recipe: colibri-per-row-int4
    layout: per_expert_colibri_int4
    format: int4_row
    experts: 64
    layers: [1, 6, 11, 16, 21, 26]
    experts_per_layer: 8
    shapes: {gate: [1408, 2048], up: [1408, 2048], down: [2048, 1408]}

codec:
  rans_scale_bits_int4: 14       # Colibri's int4-rans256-g0 value
  rans_scale_bits_exponent: 15
  interleave: 32                 # streams per block in the prototype (Colibri: 256)
  frequency_bits_charged: 16     # bits charged per transmitted table entry in estimates

timing:
  repeats: 5                     # best and median of repeats; nothing else runs on the machine meanwhile
