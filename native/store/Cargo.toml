[package]
name = "weightsift-store"
description = "Weightsift's expert store: experts described by a catalog, leased from a host-RAM cache, served through a versioned C ABI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
# rlib for Rust users (the runtime, the Colibrì bridge, tests); cdylib and staticlib for C and C++ engines.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
weightsift-io.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
sha2.workspace = true

[build-dependencies]
cc.workspace = true
