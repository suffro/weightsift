[package]
name = "lossless-moe-codec"
description = "Research prototype for the lossless MoE compression study: static and context-selected rANS over weight symbols, Colibri's int4-rans256-g0 codec built from its pinned sources, and the measurement drivers"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
build = "build.rs"

[[bin]]
name = "lmc"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[build-dependencies]
cc = "1.2"
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
opt-level = 3
debug = false
codegen-units = 1
lto = "thin"
